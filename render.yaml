services:
  - type: web
    name: map-and-pump
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: RENDER
        value: true
      - key: APP_BASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_FROM_NAME
        value: "Map & Pump"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
