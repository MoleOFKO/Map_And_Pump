services:
  - type: web
    name: map-and-pump
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: RENDER
        value: true
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        value: https://map-and-pump.online
      - key: MAIL_LOCAL_FALLBACK
        value: false
      - key: MAIL_PROVIDER
        value: resend
      - key: MAIL_FROM_NAME
        value: "Map&Pump"
      - key: RESEND_FROM_NAME
        value: "Map&Pump"
      - key: RESEND_FROM_EMAIL
        value: noreply@map-and-pump.online
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_FROM_NAME
        value: "Map&Pump"
      - key: SMTP_USERNAME
        value: mapa.and.pump@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: mapa.and.pump@gmail.com
